<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#10140f">
<title>TRU DOOR</title>
<style>
:root{--bg:#10140f;--ink:#e7f0dc;--dim:#a8b89a;--line:#2c3824;--leaf:#c6d86a;--card:#1a2216;--bad:#c4543a}
*{box-sizing:border-box} body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 Georgia,serif}
button,input{font:inherit;color:inherit}
header{padding:16px 16px 6px} h1{font-size:22px;letter-spacing:.14em;margin:0;font-weight:normal} h1 span{color:var(--leaf)}
.sub{color:var(--dim);font-size:13px}
.warn{margin:10px 16px;padding:10px 12px;border:1px solid var(--bad);border-radius:10px;font-size:14px}
.bar{display:flex;gap:8px;padding:8px 16px} input{flex:1;background:#0c100a;border:1px solid var(--line);border-radius:8px;padding:10px}
button{background:var(--leaf);color:#14180f;border:0;border-radius:8px;padding:10px 12px;font-weight:bold}
main{padding:0 16px 28px} a{color:inherit}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin:0 0 10px}
.k{color:var(--leaf);font-size:12px;letter-spacing:.12em} .big{font-size:22px;margin:4px 0} .src{color:var(--dim);font-size:12px;margin-top:6px}
.src a{color:var(--leaf)}
</style>
</head>
<body>
<header><h1>TRU <span>DOOR</span></h1><p class="sub">Points the ask at the ship that holds the card. A miss is a gap.</p></header>
<div class="warn">This page does not answer. It opens the lane. If no lane holds the ask, it says not packed.</div>
<div class="bar"><input id="q" placeholder="hurricane, verse, knot…" enterkeyhint="search"><button id="send">Send</button></div>
<main id="out"></main>
<script>
var D=[
{n:"Canonbound",w:"The Word. KJV, offline, canon-bound.",k:"bible verse scripture kjv john psalm gospel canon word",p:"https://splashdown1.github.io/tru-canonbound/",u:"https://github.com/splashdown1/tru-canonbound"},
{n:"Lifeline",w:"Body. FM 21-76 Survival 1970 and FM 21-11 First Aid 1976.",k:"survive survival hurricane power outage first aid bleed wound sick body lifeline storm weeks",p:"https://splashdown1.github.io/tru-lifeline/",u:"https://github.com/splashdown1/tru-lifeline"},
{n:"Water",w:"Emergency disinfection. EPA doses only. Settle first.",k:"water drink thirst purify bleach disinfect boil hurricane",p:"https://splashdown1.github.io/tru-water/",u:"https://github.com/splashdown1/tru-water"},
{n:"Fire",w:"FM 21-76 site, fuel ladder, dead out. No friction-fire recipe.",k:"fire heat cook fuel tinder ember dead out",p:"https://splashdown1.github.io/tru-fire/",u:"https://github.com/splashdown1/tru-fire"},
{n:"Shelter",w:"Site, size, poncho lean-to. No snow cave.",k:"shelter tent lean-to rain roof sleep cold site",p:"https://splashdown1.github.io/tru-shelter/",u:"https://github.com/splashdown1/tru-shelter"},
{n:"Cold",w:"Clean, avoid overheating, loose layers, dry. No treatment.",k:"cold freeze hypothermia layers dry COLD winter",p:"https://splashdown1.github.io/tru-cold/",u:"https://github.com/splashdown1/tru-cold"},
{n:"Pantry",w:"Food that keeps. USDA process times and altitude only.",k:"food canning pantry jar preserve altitude eat store",p:"https://splashdown1.github.io/tru-pantry/",u:"https://github.com/splashdown1/tru-pantry"},
{n:"Sun",w:"Remaining light from a clear horizon. Not a clock.",k:"sun daylight horizon fist finger sunset remaining light hour",p:"https://splashdown1.github.io/tru-sun/",u:"https://github.com/splashdown1/tru-sun"},
{n:"Salt",w:"Draws water out. Seawater is not a drink. No cure schedule.",k:"salt seawater brine meat preserve thirst drink",p:"https://splashdown1.github.io/tru-salt/",u:"https://github.com/splashdown1/tru-salt"},
{n:"Quiet",w:"Light, sound, smoke. What gives you away. Not a sentry manual.",k:"quiet noise light smoke silhouette camp give away sound",p:"https://splashdown1.github.io/tru-quiet/",u:"https://github.com/splashdown1/tru-quiet"},
{n:"Fish",w:"Where they hold, bait, line. No poison.",k:"fish bait line hook creek",p:"https://splashdown1.github.io/tru-fish/",u:"https://github.com/splashdown1/tru-fish"},
{n:"Signal",w:"Be found. Distress, phonetic, Morse, ground-to-air panels.",k:"signal sos morse distress rescue found panel",p:"https://splashdown1.github.io/tru-signal/",u:"https://github.com/splashdown1/tru-signal"},
{n:"Nav",w:"Direction plus distance. Back azimuth. No guessed declination.",k:"navigate nav azimuth lost direction trail",p:"https://splashdown1.github.io/tru-nav/",u:"https://github.com/splashdown1/tru-nav"},
{n:"Mark",w:"Find north, pace a distance, read a scale.",k:"north pace map scale compass mark",p:"https://splashdown1.github.io/tru-mark/",u:"https://github.com/splashdown1/tru-mark"},
{n:"Ford",w:"Channels, upstream pole, 45-degree course. No raft.",k:"ford cross river stream creek water crossing",p:"https://splashdown1.github.io/tru-ford/",u:"https://github.com/splashdown1/tru-ford"},
{n:"Cord",w:"Six knots that hold a load, a join, or a loop.",k:"knot rope cord tie bowline",p:"https://splashdown1.github.io/tru-cord/",u:"https://github.com/splashdown1/tru-cord"},
{n:"Load",w:"Heavy high and close. Hip belt. Rain can double it. No pound table.",k:"pack load ruck weight hip belt carry",p:"https://splashdown1.github.io/tru-load/",u:"https://github.com/splashdown1/tru-load"},
{n:"Watch",w:"One awake, a relief, a challenge word. Not a sentry manual.",k:"watch guard awake relief challenge sentry",p:"https://splashdown1.github.io/tru-watch/",u:"https://github.com/splashdown1/tru-watch"},
{n:"Wash",w:"Hands, cat hole, latrine below the water. No soap formula.",k:"wash hands latrine hygiene cat hole soap",p:"https://splashdown1.github.io/tru-wash/",u:"https://github.com/splashdown1/tru-wash"},
{n:"Blade",w:"Stone, oil, sheath. No steel recipe.",k:"knife blade sharpen stone sheath edge",p:"https://splashdown1.github.io/tru-blade/",u:"https://github.com/splashdown1/tru-blade"},
{n:"Wind",w:"Beaufort 0-12 from what you can see. Not a forecast.",k:"wind beaufort storm blow weather see",p:"https://splashdown1.github.io/tru-wind/",u:"https://github.com/splashdown1/tru-wind"},
{n:"Sky",w:"Polaris, moon phase, Orion. No planet positions.",k:"star polaris moon orion sky night",p:"https://splashdown1.github.io/tru-sky/",u:"https://github.com/splashdown1/tru-sky"},
{n:"Clock",w:"Device local time and UTC. The face the other lanes share.",k:"time clock utc hour local",p:"https://splashdown1.github.io/tru-clock/",u:"https://github.com/splashdown1/tru-clock"},
{n:"Measure",w:"Units, kitchen, temperature, time. Arithmetic only.",k:"measure unit convert calculator temperature mile cup",p:"https://splashdown1.github.io/tru-measure/",u:"https://github.com/splashdown1/tru-measure"},
{n:"Wire",w:"US neutral and ground colors. Shut off. No breaker size.",k:"wire electric neutral ground breaker power",p:"https://splashdown1.github.io/tru-wire/",u:"https://github.com/splashdown1/tru-wire"},
{n:"Drain",w:"IPC slope, trap, vent. Sewage downhill. No septic size.",k:"drain pipe sewer trap vent slope",p:"https://splashdown1.github.io/tru-drain/",u:"https://github.com/splashdown1/tru-drain"},
{n:"Build",w:"Order of work, square, brace. No span table.",k:"build square brace frame lumber",p:"https://splashdown1.github.io/tru-build/",u:"https://github.com/splashdown1/tru-build"},
{n:"Speak",w:"Fixed Pashto lines. Not a translator.",k:"speak pashto phrase language",p:"https://splashdown1.github.io/tru-speak/",u:"https://github.com/splashdown1/tru-speak"},
{n:"Rules",w:"The lane law. One file. A gap stays a gap.",k:"rule rules law gap file share",p:"https://splashdown1.github.io/tru-rules/",u:"https://github.com/splashdown1/tru-rules"},
{n:"AI",w:"Ask for the source. A gap stays a gap. The reply is not a witness.",k:"ai ask source model prompt",p:"https://splashdown1.github.io/tru-ai/",u:"https://github.com/splashdown1/tru-ai"},
{n:"Rack",w:"What a data hall is, and what a saved file still does.",k:"rack file save offline hall data",p:"https://splashdown1.github.io/tru-rack/",u:"https://github.com/splashdown1/tru-rack"},
{n:"Code",w:"One file. Words, look, steps. A gap when you do not know.",k:"code html file script lane",p:"https://splashdown1.github.io/tru-code/",u:"https://github.com/splashdown1/tru-code"},
{n:"Fleet",w:"A ship, a fleet, a harbor. Not bots.",k:"fleet ship harbor name bot",p:"https://splashdown1.github.io/tru-fleet/",u:"https://github.com/splashdown1/tru-fleet"},
{n:"Carrington",w:"1 September 1859. Flare, storm, telegraph. No modern toll.",k:"carrington flare solar telegraph 1859",p:"https://splashdown1.github.io/tru-carrington/",u:"https://github.com/splashdown1/tru-carrington"},
{n:"Astro",w:"AU, light-year, seasons, eclipse geometry. No date.",k:"astro astronomy eclipse season light-year",p:"https://splashdown1.github.io/tru-astro/",u:"https://github.com/splashdown1/tru-astro"}
];
function esc(s){return String(s).replace(/[&<>]/g,function(c){return {"&":"&","<":"<",">":">"}[c];});}
function card(x){
  return '<article class="card"><div class="k">DOOR</div><div class="big">'+esc(x.n)+'</div><div>'+esc(x.w)+'</div><div class="src"><a href="'+x.p+'">Open lane</a> · <a href="'+x.u+'">Repository</a></div></article>';
}
function gap(){
  return '<article class="card"><div class="k">GAP</div><div class="big">Not packed</div><div>No ship holds that ask. The door does not invent a lane.</div></article>';
}
function hits(q){
  q=(q||"").trim().toLowerCase();
  if(!q) return D;
  var words=q.split(/\s+/);
  return D.filter(function(x){
    var hay=(x.n+" "+x.w+" "+x.k).toLowerCase();
    for(var i=0;i<words.length;i++){ if(hay.indexOf(words[i])>=0) return true; }
    return false;
  });
}
function show(q){
  var h=hits(q);
  document.getElementById("out").innerHTML=h.length?h.map(card).join(""):gap();
}
document.getElementById("send").onclick=function(){show(document.getElementById("q").value);};
document.getElementById("q").onkeydown=function(e){if(e.key==="Enter") show(e.target.value);};
show("");
</script>
</body>
</html>
